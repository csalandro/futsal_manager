# Base de datos local para desarrollo. Las credenciales salen de .env.
#   docker compose up -d      → levanta Postgres
#   docker compose down       → lo apaga (los datos quedan en el volumen)
#   docker compose down -v    → lo apaga y borra los datos
services:
  db:
    image: postgres:17-alpine
    container_name: futsal-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
