# Entorno local completo con Docker. Las credenciales salen de .env (npm run setup).
#   docker compose up -d --build   → Postgres + app (API y web) en http://localhost:3000
#   docker compose up -d db        → solo Postgres, para desarrollar con `npm run dev`
#   docker compose down            → apaga todo (los datos quedan en el volumen)
#   docker compose down -v         → apaga y borra los datos
services:
  db:
    image: postgres:17-alpine
    container_name: futsal-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: futsal-manager-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro de la red de Docker la base se llama "db", no localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Local por http: la cookie no puede ser "secure". Detrás de HTTPS, poner true.
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  pgdata:
